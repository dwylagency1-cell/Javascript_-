<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cart</title>
</head>
<body>
    <button onclick="
        alert(`Cart quantity: ${cartQuantity}`);">show cart quantity</button>
    <button onclick="
    fullCart()
    if (cartQuantity < 10){
        cartQuantity = cartQuantity + 1
        alert(`Cart quantity: ${cartQuantity}`);

    }
    ">Add to cart</button>
    <button onclick="
    fullCart()
    if (cartQuantity < 10){
        cartQuantity = cartQuantity + 2
        alert(`Cart quantity: ${cartQuantity}`);
    }
    ">+ 2</button>
    <button onclick="
    fullCart()
    if (cartQuantity < 10){
        cartQuantity = cartQuantity + 3
        alert(`Cart quantity: ${cartQuantity}`);

    }">+ 3</button>
    <button onclick="
    alert('Cart has been reset');
    cartQuantity = 0
    alert(`Cart quantity: ${cartQuantity}`);
    ">reset cart</button>

    <button onclick="
    notEnough()
    if (cartQuantity > 0) {
        cartQuantity = cartQuantity - 2
        alert(`Cart quantity: ${cartQuantity}`);
    }
    
    ">- 2</button>
    <button onclick="
    notEnough()
    if (cartQuantity > 0){
        cartQuantity = cartQuantity - 3
        alert(`Cart quantity: ${cartQuantity}`);
    }
    ">- 3</button>



    <script>
        let cartQuantity = 0;

        function fullCart() {
            if (cartQuantity >= 10) {
                alert('Cart is full !');
            }
        }

        function notEnough() {
            if (cartQuantity <= 0) {
                alert('Not enough items in the cart');
            }
        }

    </script>
</body>
</html>
