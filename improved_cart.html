<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cart</title>
</head>
<body>
    <button onclick="
        alert(`Cart quantity: ${cartQuantity}`);
        document.querySelector('.all-para').innerHTML = `Cart quantity: ${cartQuantity}`">show cart quantity</button>
    <button onclick="
    fullCart()
    if (cartQuantity < 10){
        addToCart(1);

    }

    ">Add to cart</button>
    <button onclick="
    fullCart()
    if (cartQuantity < 10){
        addToCart(2)
    }

    ">+ 2</button>
    <button onclick="
    fullCart()
    if (cartQuantity < 10){
        addToCart(3)

    }">+ 3</button>
    <button onclick="
    alert('Cart has been reset');
    cartQuantity = 0
    alert(`Cart quantity: ${cartQuantity}`);
    document.querySelector('.all-para').innerHTML = `Cart quantity: ${cartQuantity}`">reset cart</button>

    <button onclick="
    notEnough()
    if (cartQuantity > 0) {
        subtractToCart(2)
    }
    
    ">- 2</button>
    <button onclick="
    notEnough()
    if (cartQuantity > 0){
        subtractToCart(3)
    }
    ">- 3</button>

    <p class="all-para"></p>



    <script>
        let cartQuantity = 0;

        function fullCart() {
            if (cartQuantity >= 10) {
                alert('Cart is full !');
            }
        }

        function notEnough() {
            if (cartQuantity <= 0) {
                document.querySelector()
                alert('Not enough items in the cart');
            }
        }

        function addToCart(num) {
            cartQuantity = cartQuantity + num
            document.querySelector('.all-para').innerHTML = `Cart quantity: ${cartQuantity}`
            alert(`Cart quantity: ${cartQuantity}`);
        }

        function subtractToCart(num) {
            cartQuantity = cartQuantity - num
            alert(`Cart quantity: ${cartQuantity}`);
            document.querySelector('.all-para').innerHTML = `Cart quantity: ${cartQuantity}`
        }

    </script>
</body>
</html>
