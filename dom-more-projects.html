<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM projects</title>
    <link rel = 'stylesheet' href="dom-more-project.css">
</head>

<body>

    <button class="Gaming" onclick="
        when_click_button('.Gaming')">Gaming</button>

    <button class="Music" onclick="
    when_click_button('.Music')">Music</button>

    <button class="Tech" onclick="
    when_click_button('.Tech')">Tech</button>

    <div class="div">
        <button class="Male" onclick="
            either_of_the_button(this)">Male</button>
        <button class="Female" onclick="
        either_of_the_button(this)">Female</button>
        <button class="prefer_not_to_say" onclick="
        either_of_the_button(this)">prefer not to say</button>

    </div>
    <div class="div_2">
        <input class="cost input_styling" type="number" placeholder="Enter a cost" onkeydown="
        if (event.key === 'Enter') {
            calculate_cost()
        }">
        <button class="cost_button" onclick="
        calculate_cost()">Calculate</button>
        
    </div>
    <p style="margin-left: 55px;
    position: relative;
    bottom: 15px;
    color: red;
    font-family: arial;
    font-size: 13px;"class="cost_para"></p>


    <script src="dom-more-project.js"></script>
</body>
</html>
