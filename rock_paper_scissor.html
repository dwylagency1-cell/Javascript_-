<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <style>
        .para_1{
            font-size: 30px;
            font-weight: bold;
        }
        .reset_button{
            background-color: rgb(226, 225, 225);
            border-style: none;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 15px;
            padding-right: 15px;
            border-radius: 10px;
            cursor: pointer;

        }
        .button_icon{
            width: 100px;
            background-color: rgb(30, 30, 30);
            border-radius: 60px;
            
        }
    </style>
</head>
<body style="background-color: rgb(30, 30, 30); 
color: white;
font-family: arial;">
    
    <p class="para_1">Rock Paper Scissor</p>
    <button onclick="
        
        playgame('Rock')
        "><img class="button_icon" src="rock.png">
    </button>
    <button onclick="
    
    playgame('Paper')
        "><img class="button_icon" width="100px" src="papericon.png">
    </button>   
    <button onclick="
    playgame('Scissor')
        "><img class="button_icon" width="100px" src="scissors-emoji.png">
    </button>  

    <button class="reset_button" onclick="
    score.win =0 
    score.loose = 0
    score.draw = 0
    localStorage.setItem('score', JSON.stringify(score));
    
    alert(`your score has been reset !\nWin: ${score.win}, loose: ${score.loose}, Draw: ${score.draw}`);
    alert(`Now refresh the page !!`)
    document.querySelector('js-score').innerHTML = `Win: ${score.win}, loose: ${score.loose}, draw: ${score.draw}`;
    
    ">Reset Score</button>
    <p class="js-result"></p>
    <p class="js-score"></p>

    
    <script>
        const score = JSON.parse(localStorage.getItem('score')) || {
            win: 0,
            loose: 0,
            draw: 0

            
        }; 

        document.querySelector('.js-score').innerHTML = `Win: ${score.win}, loose: ${score.loose}, draw: ${score.draw}`;
        
                    
        
        function playgame(playermove) {
            rps();
            if (playermove === 'Scissor') {
                
                if (computerMove === 'Rock') {
                    score.loose = score.loose + 1
                    alert(`computer: Rock , you: ${playermove}; you lose!
                    Win: ${score.win}, loose: ${score.loose}, draw: ${score.draw}`);
                    document.querySelector('.js-result').innerHTML = 'you lose'
                    
                    

                    }
                else if (computerMove === 'Paper') {
                    score.win = score.win + 1
                    alert(`computer: Paper , you: ${playermove}; you won!
                    Win: ${score.win}, loose: ${score.loose}, draw: ${score.draw}`);
                    document.querySelector('.js-result').innerHTML = 'you won'
                    


                    }
                else if (computerMove === 'Scissor') {
                    score.draw = score.draw + 1
                    alert(`computer: Scissor , you: ${playermove}; Draw!
                    Win: ${score.win}, loose: ${score.loose}, draw: ${score.draw}`);
                    document.querySelector('.js-result').innerHTML = 'Draw'
                    
                    }
                    
                }
                
                
            else if (playermove === 'Rock') {
                if (computerMove === 'Rock') {
                    score.draw = score.draw + 1
                    alert(`computer: Rock , you: Rock; Draw!
                    Win: ${score.win}, loose: ${score.loose}, draw: ${score.draw}`);
                    document.querySelector('.js-result').innerHTML = 'Draw'
                    
                    }
                else if (computerMove === 'Paper') {
                    score.loose = score.loose + 1
                    alert(`computer: Paper , you: Rock; you lose!
                    Win: ${score.win}, loose: ${score.loose}, draw: ${score.draw}`);
                    document.querySelector('.js-result').innerHTML = 'you lose'
                    

                    }
                else if (computerMove === 'Scissor') {
                    score.win = score.win + 1
                    alert(`computer: Scissor , you: Rock; you won!
                    Win: ${score.win}, loose: ${score.loose}, draw: ${score.draw}`);
                    document.querySelector('.js-result').innerHTML = 'you won'
                    
                    }
            }
            else if (playermove === 'Paper') {
                    if (computerMove === 'Rock') {
                        score.win = score.win + 1
                        alert(`computer: Rock , you: ${playermove}; you won!
                        Win: ${score.win}, loose: ${score.loose}, draw: ${score.draw}`);
                        document.querySelector('.js-result').innerHTML = 'you won'
                        
                        }
                    else if (computerMove === 'Paper') {
                        score.draw = score.draw + 1
                        alert(`computer: Paper , you: ${playermove};Draw!
                        Win: ${score.win}, loose: ${score.loose}, draw: ${score.draw}`);
                        document.querySelector('.js-result').innerHTML = 'Draw'
                        

                        }
                    else if (computerMove === 'Scissor') {
                        score.loose = score.loose + 1
                        alert(`computer: Scissor , you: ${playermove}; you lose!
                         Win: ${score.win}, loose: ${score.loose}, draw: ${score.draw}`);
                         document.querySelector('.js-result').innerHTML = 'you lose'
                        
                        }

            }
            localStorage.setItem('score' , JSON.stringify(score));


            document.querySelector('.js-score').innerHTML = `Win: ${score.win}, loose: ${score.loose}, draw: ${score.draw}`;

            }
            
            



        let computerMove = '';
        function rps() {
            let random = Math.random();
            
            if (random >= 0 && random < 1/3) {
                computerMove = 'Rock';
            }
            else if (random >= 1/3 && random < 2/3) {
                computerMove = 'Paper';
            }
            else if (random >= 2/3 && random < 1 ) {
                computerMove = 'Scissor';
            }

        }
    </script>
    
</body>
</html>
