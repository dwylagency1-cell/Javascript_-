<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock , Paper, Scissors</title>
</head>
<body>
    

    <button onclick="
        rps();
        playgame('Rock')
        ">Rock
    </button>
    <button onclick="
    rps();
    playgame('Paper')
        ">Paper
    </button>   
    <button onclick="
    playgame('Scissor')
        ">Scissor
    </button>  
    
    <script>
        function playgame(playermove) {
            rps();
            if (playermove === 'Scissor') {
                
                if (computerMove === 'Rock') {
                    alert(`computer: Rock , you: ${playermove}; you loose!`);
                    }
                else if (computerMove === 'Paper') {
                    alert(`computer: Paper , you: ${playermove}; you won!`);

                    }
                else if (computerMove === 'Scissor') {
                    alert(`computer: Scissor , you: ${playermove}; Draw!`);
                    }
                }
            else if (playermove === 'Rock') {
                if (computerMove === 'Rock') {
                    alert('computer: Rock , you: Rock; Draw!');
                    }
                else if (computerMove === 'Paper') {
                    alert('computer: Paper , you: Rock; you loose!');

                    }
                else if (computerMove === 'Scissor') {
                    alert('computer: Scissor , you: Rock; you won!');
                    }
            }
            else if (playermove === 'Paper') {
                    if (computerMove === 'Rock') {
                        alert(`computer: Rock , you: ${playermove}; you won!`);
                        }
                    else if (computerMove === 'Paper') {
                        alert(`computer: Paper , you: ${playermove};Draw!`);

                        }
                    else if (computerMove === 'Scissor') {
                        alert(`computer: Scissor , you: ${playermove}; you loose!`);
                        }

            }

            }
            



        let computerMove = '';
        function rps() {
            let random = Math.random();
            
            if (random >= 0 && random < 1/3) {
                computerMove = 'Rock';
            }
            else if (random >= 1/3 && random < 2/3) {
                computerMove = 'Paper';
            }
            else if (random >= 2/3 && random < 1 ) {
                computerMove = 'Scissor';
            }

        }
    </script>
    
</body>
</html>
