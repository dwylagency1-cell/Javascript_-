<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock , Paper, Scissors</title>
</head>
<body>
    

    <button onclick="
        rps();
        if (computerMove === 'Rock') {
            alert('computer: Rock , you: Rock; Draw!');
        }
        else if (computerMove === 'Paper') {
            alert('computer: Paper , you: Rock; you loose!');

        }
        else if (computerMove === 'Scissor') {
            alert('computer: Scissor , you: Rock; you won!');
        }">Rock
    </button>
    <button onclick="
        rps();
        if (computerMove === 'Rock') {
            alert('computer: Rock , you: Paper; you won!');
        }
        else if (computerMove === 'Paper') {
            alert('computer: Paper , you: Paper; Draw!');

        }
        else if (computerMove === 'Scissor') {
            alert('computer: Scissor , you: Paper; you loose!');
        }">Paper
    </button>   
    <button onclick="
        rps();
        if (computerMove === 'Rock') {
            alert('computer: Rock , you: Scissor; you loose!');
        }
        else if (computerMove === 'Paper') {
            alert('computer: Paper , you: Scissor; you won!');

        }
        else if (computerMove === 'Scissor') {
            alert('computer: Scissor , you: Scissor; Draw!');
        }">Scissor
    </button>  
    
    <script>
        let computerMove = '';
        function rps() {
            let random = Math.random();
            
            if (random >= 0 && random < 1/3) {
                computerMove = 'Rock';
            }
            else if (random >= 1/3 && random < 2/3) {
                computerMove = 'Paper';
            }
            else if (random >= 2/3 && random < 1 ) {
                computerMove = 'Scissor';
            }

        }
    </script>
    
</body>
</html>
