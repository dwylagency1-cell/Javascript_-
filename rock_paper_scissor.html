<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock , Paper, Scissors</title>
</head>
<body>
    

    <button onclick="
        
        playgame('Rock')
        ">Rock
    </button>
    <button onclick="
    
    playgame('Paper')
        ">Paper
    </button>   
    <button onclick="
    playgame('Scissor')
        ">Scissor
    </button>  

    <button onclick="
    score.win =0 
    score.loose = 0
    score.draw = 0
    alert('your score has been reset !');
    alert(`Win: ${score.win}, loose: ${score.loose}, Draw: ${score.draw}`)
    ">Reset Score</button>
    
    <script>
        const score = {
            win: 0,
            loose: 0,
            draw: 0,
        }
        
        function playgame(playermove) {
            rps();
            if (playermove === 'Scissor') {
                
                if (computerMove === 'Rock') {
                    score.loose = score.loose + 1
                    alert(`computer: Rock , you: ${playermove}; you loose!
                    Win: ${score.win}, loose: ${score.loose}, draw: ${score.draw}`);
                    
                    

                    }
                else if (computerMove === 'Paper') {
                    score.win = score.win + 1
                    alert(`computer: Paper , you: ${playermove}; you won!
                    Win: ${score.win}, loose: ${score.loose}, draw: ${score.draw}`);
                    


                    }
                else if (computerMove === 'Scissor') {
                    score.draw = score.draw + 1
                    alert(`computer: Scissor , you: ${playermove}; Draw!
                    Win: ${score.win}, loose: ${score.loose}, draw: ${score.draw}`);
                    
                    }
                }
            else if (playermove === 'Rock') {
                if (computerMove === 'Rock') {
                    score.draw = score.draw + 1
                    alert(`computer: Rock , you: Rock; Draw!
                    Win: ${score.win}, loose: ${score.loose}, draw: ${score.draw}`);
                    
                    }
                else if (computerMove === 'Paper') {
                    score.loose = score.loose + 1
                    alert(`computer: Paper , you: Rock; you loose!
                    Win: ${score.win}, loose: ${score.loose}, draw: ${score.draw}`);
                    

                    }
                else if (computerMove === 'Scissor') {
                    score.win = score.win + 1
                    alert(`computer: Scissor , you: Rock; you won!
                    Win: ${score.win}, loose: ${score.loose}, draw: ${score.draw}`);
                    
                    }
            }
            else if (playermove === 'Paper') {
                    if (computerMove === 'Rock') {
                        score.win = score.win + 1
                        alert(`computer: Rock , you: ${playermove}; you won!
                        Win: ${score.win}, loose: ${score.loose}, draw: ${score.draw}`);
                        
                        }
                    else if (computerMove === 'Paper') {
                        score.draw = score.draw + 1
                        alert(`computer: Paper , you: ${playermove};Draw!
                        Win: ${score.win}, loose: ${score.loose}, draw: ${score.draw}`);
                        

                        }
                    else if (computerMove === 'Scissor') {
                        score.loose = score.loose + 1
                        alert(`computer: Scissor , you: ${playermove}; you loose!
                         Win: ${score.win}, loose: ${score.loose}, draw: ${score.draw}`);
                        
                        }

            }

            }
            



        let computerMove = '';
        function rps() {
            let random = Math.random();
            
            if (random >= 0 && random < 1/3) {
                computerMove = 'Rock';
            }
            else if (random >= 1/3 && random < 2/3) {
                computerMove = 'Paper';
            }
            else if (random >= 2/3 && random < 1 ) {
                computerMove = 'Scissor';
            }

        }
    </script>
    
</body>
