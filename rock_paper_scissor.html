<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="rock_paper_scissor.css">
    <style>
        
    </style>
</head>
<body style="background-color: rgb(30, 30, 30); 
color: white;
font-family: arial;">
    
    <p class="para_1">Rock Paper Scissor</p>
    <button onclick="
        
        playgame('Rock')
        "><img class="button_icon" src="rock.png">
    </button>
    <button onclick="
    
    playgame('Paper')
        "><img class="button_icon" width="100px" src="papericon.png">
    </button>   
    <button onclick="
    playgame('Scissor')
        "><img class="button_icon" width="100px" src="scissors-emoji.png">
    </button>  

    <button class="reset_button" onclick="
    score.win =0 
    score.loose = 0
    score.draw = 0
    localStorage.setItem('score', JSON.stringify(score));
    
    alert(`your score has been reset !\nWin: ${score.win}, loose: ${score.loose}, Draw: ${score.draw}`);
    alert(`Now refresh the page !!`)
    document.querySelector('js-score').innerHTML = `Win: ${score.win}, loose: ${score.loose}, draw: ${score.draw}`;
    
    ">Reset Score</button>
    
    <p class="js-result"></p>
    <p class="js-score"></p>

    
    <script src="rock_paper_scissor.js">
        
    </script>
    
</body>
</html>
