<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
</head>
<body>
    <button onclick="
       number(1)">1</button>

    <button onclick="
    number(2)">2</button>

    <button onclick="
    number(3)">3</button>

    <button onclick="
    number(4)">4</button>

    <button onclick="
    number(5)">5</button>

    <button onclick="
    number(6)">6</button>

    <button onclick="
    number(7)">7</button>

    <button onclick="
    number(8)">8</button>

    <button onclick="
    number(9)">9</button>

    <button onclick="
    number(0)">0</button>

    <button onclick="
    calculation = ''
    localStorage.setItem('numbers', JSON.stringify(calculation))">reset numbers</button>

    <script>
        let calculation = JSON.parse(localStorage.getItem('numbers')) || '';

        function number(num) {
            calculation = calculation + num
            console.log(calculation)

        localStorage.setItem('numbers', JSON.stringify(calculation));

        }



        

    </script>
    
</body>
</html>
