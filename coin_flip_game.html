<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>coin_flip_game</title>
</head>
<body>
    
    <button onclick="
        let random = Math.random();
        if (random < 1/2) {
            result = 'head'
        }
        else{
            result = 'tail'
        }


        if (result === 'head') {
            score.win = score.win + 1;
            alert(`your guess is right , you won\n win: ${score.win} , losses: ${score.losses}`);
        }
        else{
            score.losses = score.losses + 1;
            alert(`your guess is wrong, you loose\n losses: ${score.losses} , win: ${score.win}`);
        
        }
        localStorage.setItem('score', JSON.stringify(score));">head</button>

        <button onclick="
        let random_2 =  Math.random();
        if (random_2 < 1/2) {
            result = 'head'
        }
        else{
            result = 'tail'
        }

        if (result === 'tail') {
            score.win = score.win + 1;
            alert(`your guess is right , you won\n win: ${score.win} , losses: ${score.losses}`);
        }
        else{
            score.losses = score.losses + 1;
            alert(`your guess is wrong, you loose\n losses: ${score.losses} , win: ${score.win}`);
        }
        localStorage.setItem('score', JSON.stringify(score));">tail</button>

        <button onclick="
        score = {
            win: 0,
            losses: 0
        }
        
        localStorage.setItem('score', JSON.stringify(score));">reset score</button>

    <script>

        let score =JSON.parse(localStorage.getItem('score')) || {
            win: 0,
            losses: 0
        };

    </script>

    
    
</body>
</html>
